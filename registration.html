<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TechSymposium 2026 | Registration</title>
    <meta
      name="description"
      content="Register for your preferred technical events at TechSymposium 2026."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container nav-wrapper">
        <a class="brand" href="index.html">
          <span class="brand-badge">TS</span>
          <span>TechSymposium 2026</span>
        </a>
        <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
        <nav class="site-nav" aria-label="Main Navigation">
          <a href="index.html">Home</a>
          <a href="events.html">Events</a>
          <a href="registration.html">Registration</a>
          <a href="speakers.html">Speakers</a>
          <a href="announcements.html">Announcements</a>
          <a href="contact.html">Contact Us</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="page-banner">
        <div class="container reveal">
          <p class="tag">Registration</p>
          <h1>Reserve Your Spot</h1>
          <p>Fill out the form to participate in your selected event.</p>
        </div>
      </section>

      <section class="section">
        <div class="container form-wrapper reveal">
          <form id="registrationForm" class="registration-form" novalidate>
            <div class="input-group">
              <label for="fullName">Full Name</label>
              <input type="text" id="fullName" name="fullName" required />
              <small class="error-message"></small>
            </div>
            <div class="input-group">
              <label for="email">Email</label>
              <input type="email" id="email" name="email" required />
              <small class="error-message"></small>
            </div>
            <div class="input-group">
              <label for="phone">Phone Number</label>
              <input type="tel" id="phone" name="phone" required />
              <small class="error-message"></small>
            </div>
            <div class="input-group">
              <label for="college">College Name</label>
              <input type="text" id="college" name="college" required />
              <small class="error-message"></small>
            </div>
            <div class="input-group">
              <label for="event">Event Selection</label>
              <select id="event" name="event" required>
                <option value="">Select an event</option>
                <option>Hackathon Sprint</option>
                <option>RoboRace Arena</option>
                <option>Code Debug Duel</option>
                <option>UI/UX Design Challenge</option>
                <option>Cyber Security Workshop</option>
                <option>Project Expo</option>
              </select>
              <small class="error-message"></small>
            </div>
            <button type="submit" class="btn btn-primary">Submit Registration</button>
            <p id="formMessage" class="form-message" aria-live="polite"></p>
          </form>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-grid">
        <p>&copy; 2026 TechSymposium, ABC College of Engineering.</p>
        <div class="social-links">
          <a href="#" aria-label="Instagram">Instagram</a>
          <a href="#" aria-label="LinkedIn">LinkedIn</a>
          <a href="#" aria-label="YouTube">YouTube</a>
        </div>
      </div>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
