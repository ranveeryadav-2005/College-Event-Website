apiVersion: apps/v1
kind: Deployment
metadata:
  name: college-event-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: college-event
  template:
    metadata:
      labels:
        app: college-event
    spec:
      containers:
      - name: college-event-container
        image: college-event-website:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80